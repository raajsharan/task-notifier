version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tasknotifier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: tasknotifier
    ports:
      - "5432:5432"
    volumes:
      - tasknotifier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasknotifier"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tasknotifier_pgdata:
